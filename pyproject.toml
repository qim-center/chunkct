[project]
name = "chunkct"
dynamic = ["version"]
description = "Chunked CT reconstruction (FDK) with CIL for scans larger than GPU or host memory, with Zarr storage and batch jobs on the DTU HPC cluster (LSF)."
readme = "README.md"
authors = [{ name = "David Wang Johansen" }]
requires-python = ">=3.10"
# NOTE: CIL (and its GPU backend TIGRE) are NOT on PyPI and therefore cannot be
# declared here. Install them from conda (conda-forge / ccpi) — see README.
dependencies = [
    "numpy",
    "zarr>=3",
    "dask",
    "tifffile",
    "scikit-image",
    "tqdm",
    "cyclopts>=3",
    "cloudpickle",
]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
chunkct = "chunkct.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# --------------------------------------------------------------------------- #
# pixi
# --------------------------------------------------------------------------- #
[tool.pixi.workspace]
channels = ["conda-forge", "ccpi"]
platforms = ["linux-64", { name = "linux-64-cuda-12", platform = "linux-64", cuda = "12" }]

[tool.pixi.dependencies]
python = "3.12.*"
cil = ">=26.0.0"
numpy = "*"
zarr = ">=3"
dask = "*"
tifffile = "*"
scikit-image = "*"
tqdm = "*"
cyclopts = ">=3"
cloudpickle = "*"
matplotlib = "*"

[tool.pixi.pypi-dependencies]
chunkct = { path = ".", editable = true }

[tool.pixi.feature.gpu]
platforms = ["linux-64-cuda-12"]

[tool.pixi.feature.gpu.dependencies]
tigre = { version = "*", channel = "ccpi" }

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.lint.dependencies]
ruff = "*"
# Git hooks runner (Rust reimplementation of pre-commit); config in .pre-commit-config.yaml.
prek = "*"
# Git filter that strips notebook outputs from what is staged (set up with `nbstripout --install`).
nbstripout = "*"

[tool.pixi.feature.cpu]
platforms = ["linux-64"]

[tool.pixi.feature.notebook.dependencies]
# Metapackage: JupyterLab, classic Notebook, ipykernel, ipywidgets, nbconvert, console.
jupyter = "*"

# Interactive visualisation for checking reconstructions in notebooks (dev only).
[tool.pixi.feature.notebook.pypi-dependencies]
qim3d = ">=1.6"

[tool.pixi.environments]
# The development environment: what `pixi run` uses when no `-e` is given.
# GPU reconstruction (TIGRE) + tests + lint + Jupyter/qim3d. Run on a GPU node.
default = { features = ["gpu", "test", "lint", "notebook"], solve-group = "gpu" }
# Only what the package itself needs to reconstruct (same versions as default via the
# shared solve-group). For checking that nothing dev-only has crept into the code.
runtime = { features = ["gpu"], solve-group = "gpu" }
# CPU-only: lint + fast tests. Works on login nodes (no GPU needed).
cpu = { features = ["cpu", "test", "lint"] }

[tool.pixi.feature.lint.tasks]
lint = "ruff check . && ruff format --check ."
fmt = "ruff check --fix . && ruff format ."

[tool.pixi.feature.test.tasks]
# Fast CPU tests: the default for day-to-day development (seconds).
test = "pytest -m 'not gpu'"
test-gpu = "pytest -m gpu"
test-all = "pytest"
# Submit the GPU tests as an LSF job from a login node (DTU HPC); logs go to out/bjobs/.
hpc-test-gpu = "bsub < scripts/hpc/gpu_tests.bsub"

# --------------------------------------------------------------------------- #
# tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests `import helpers`
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "gpu: needs a CUDA GPU and TIGRE (run with `pixi run test-gpu`)",
]
